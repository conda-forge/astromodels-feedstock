{% set name = "astromodels" %}
{% set version = "2.5.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/astromodels-{{ version }}.tar.gz
  sha256: 10b29d6f2a9857ae15e67314130246bd05ee2e94ccb8a0a3540f3072b1fc6db8

build:
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0
  skip: true  # [win]
  skip: true  # [py<=310]

requirements:
  build:
    - {{ compiler('cxx') }}
    - {{ stdlib("c") }}
  host:
    - python
    - numpy
    - pip
    - setuptools
    - versioneer
  run:
    - versioneer
    - astropy >=1.2
    - python
    - numpy >=1.6
    - pyyaml >=5.1
    - scipy >=0.14
    - astropy-base >=1.2
    - dill
    - future
    - interpolation >=2.2.3
    - numba
    - h5py
    - pandas
    - pytables
    - colorama
    - omegaconf
    - rich
    - joblib

test:
  imports:
    - astromodels
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/threeml/astromodels
  summary: Astromodels contains models to be used in likelihood or Bayesian analysis in astronomy
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - jan-janssen
